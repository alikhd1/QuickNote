[package]
name = "quick-note"
version = "1.0.0"
description = "Portable note app that lives on your flash drive"
edition = "2021"
rust-version = "1.77"

# Tauri v2 layout: the app lives in a library so a mobile target can call run()
# directly, with main.rs as a thin desktop entry point.
[lib]
name = "quick_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset backs the inline images in the preview. It must match the
# assetProtocol block in tauri.conf.json, which the build script checks.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small binary: this rides on a flash drive, so size is worth the compile time.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
